
name: Build GD Version Switcher

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Build Android mod
        id: build
        uses: GEODE_VERSION
        with:
          sdk: latest
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Version-Switcher
          path: ${{ steps.build.outputs.build-outp
          ut }}
